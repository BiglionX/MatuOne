name: e2e-auth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-auth-db
  cancel-in-progress: false

jobs:
  auth-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: 'true'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Run gate rules audit
        run: npm run test:gates

      - name: Write .env.test
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "GitHub Secrets 缺少 DATABASE_URL"
            exit 1
          fi
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.test
          if [ -n "$E2E_BASE_URL" ]; then
            printf 'E2E_BASE_URL=%s\n' "$E2E_BASE_URL" >> .env.test
          fi

      - name: Run auth regression
        run: npm run e2e:auth -- --reporter=list

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth-regression
          path: |
            test-results/
            playwright-report/
            e2e/screenshots/
          if-no-files-found: ignore
